<ol class="relative border-l border-border ml-2">
    {{ range sort . "from" "desc" }}
    <li class="mb-8 ml-6">
        <div class="absolute w-3 h-3 rounded-full mt-1.5 -left-1.5 border border-surface bg-border"></div>
        <time class="text-sm font-medium text-text-muted">{{ .from }} - {{.to}}</time>
        <h3 class="text-lg font-semibold text-text-primary mt-1">{{ .title }}</h3>
        <p class="text-text-secondary text-sm">
            <em>{{if .company }}{{.company}}, {{end}}{{.where}}</em>
        </p>
    </li>
    {{ end }}
</ol>
