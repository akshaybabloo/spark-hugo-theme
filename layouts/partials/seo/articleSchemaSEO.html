{{ $url := "" }}
{{- if (isset .Params "images") }}
    {{ $url = index .Params.images 0 }}
{{- else -}}
    {{ $url = .Site.Params.thumbnailUrl }}
{{ end }}

{{ $src := partial "resource-check" (dict "page" . "src" $url ) }}

<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Article",
        "publisher": {
            "@type": "Organization",
            "name": "{{ .Site.Title }}",
            "url": {{ .Site.BaseURL | jsonify | safeJS }},
            "logo": {
                "@type": "ImageObject",
                "url": {{ .Site.Params.logoPhoto | absURL | jsonify | safeJS }},
                "width": 60,
                "height": 60
            }
        },
        "author": {
            "@type": "Person",
            "name": "{{ if .Params.author }}{{ .Params.author.firstName }} {{ .Params.author.lastName }}{{ else }}{{ .Site.Title }}{{ end }}",
            "image": {
                "@type": "ImageObject",
                "url": {{ .Site.Params.logoPhoto | absURL | jsonify | safeJS }},
                "width": 481,
                "height": 533
            },
            "url": {{ .Site.BaseURL | jsonify | safeJS }},
            "sameAs": [
                {{ .Site.Params.social.twitter | jsonify | safeJS }},
                {{ .Site.Params.social.github | jsonify | safeJS }},
                {{ .Site.Params.social.linkedin | jsonify | safeJS }},
                {{ .Site.BaseURL | jsonify | safeJS }}
            ]
        },
        "headline": {{ .Title | jsonify | safeJS }},
        "url": {{ .Permalink | jsonify | safeJS }},
        "datePublished": {{ .PublishDate.Format "2006-01-02T15:04:05-07:00" | jsonify | safeJS }},
        {{- if not (eq .Lastmod .Date) }}
        "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05-07:00" | jsonify | safeJS }},
        {{- end }}
        "image": {{ $src | absURL | jsonify | safeJS }},
        "keywords": {{ delimit .Params.tags ", " | jsonify | safeJS }},
        "description": {{ .Description | jsonify | safeJS }},
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": {{ .Site.BaseURL | jsonify | safeJS }}
        }
    }
</script>
