<!-- Image Maximize Modal -->
<div v-if="imageModalVisible"
     v-cloak
     @click.self="closeImageModal()"
     class="fixed inset-0 z-50 bg-bg/90 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="relative max-w-5xl w-full">
        <!-- Close button -->
        <button type="button"
                @click="closeImageModal()"
                class="absolute -top-12 right-0 p-2 text-text-muted hover:text-text-primary transition-colors cursor-pointer"
                aria-label="Close">
            <span aria-hidden="true" class="material-symbols-outlined">close</span>
        </button>

        <!-- Image -->
        <img :src="imageModalSrc"
             :alt="imageModalAlt"
             class="w-full h-auto max-h-[85vh] object-contain rounded-lg">
    </div>
</div>
