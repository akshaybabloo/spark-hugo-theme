{{define "main"}}
<article class="w-full max-w-4xl mx-auto px-6 py-12 md:py-20">
    <!-- Page Header -->
    <header class="mb-12 md:mb-16">
        <h1 class="text-4xl md:text-6xl font-black text-text-primary tracking-tight leading-tight mb-6">
            {{ .Title }}
        </h1>
        {{ if .Description }}
        <p class="text-xl md:text-2xl text-text-secondary leading-relaxed max-w-2xl">
            {{ .Description }}
        </p>
        {{ end }}
    </header>

    <!-- Page Content -->
    <div class="prose prose-lg prose-invert max-w-none 
                prose-headings:text-text-primary prose-headings:font-bold prose-headings:tracking-tight
                prose-p:text-text-secondary prose-p:leading-relaxed
                prose-a:text-text-primary prose-a:font-medium prose-a:underline prose-a:decoration-text-muted prose-a:underline-offset-4 hover:prose-a:decoration-text-primary prose-a:transition-all
                prose-strong:text-text-primary
                prose-code:text-accent prose-code:bg-surface-hover prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded prose-code:before:content-none prose-code:after:content-none
                prose-pre:bg-surface prose-pre:border prose-pre:border-border prose-pre:rounded-xl
                prose-blockquote:border-l-4 prose-blockquote:border-text-primary prose-blockquote:bg-surface/50 prose-blockquote:py-2 prose-blockquote:px-6 prose-blockquote:rounded-r-lg prose-blockquote:not-italic
                prose-img:rounded-2xl prose-img:shadow-lg
                prose-hr:border-border">
        {{ .Content }}
    </div>
</article>
{{end}}
